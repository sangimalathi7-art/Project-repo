<!-- contact section start -->
<section class="py-5" data-bs-theme="dark"">
  <div class="container">
    <h2 class="text-center fw-bold mb-2">Contact me</h2>
      <p class="text-center text-secondary mb-5">Cultivating Connections: Reach Out And Connect With Me</p>

    <form action="#" method="POST">
      <div class="row g-4">
        <div class="col-md-6 col-sd-12">
          <input type="text" class="form-control bg-secondary-subtle border-0 py-3" name="name" placeholder="Name" required>
        </div>
        <div class="col-md-6 col-sd-12">
          <input type="email" class="form-control bg-secondary-subtle border-0 py-3" name="email" placeholder="Email" required>
        </div>

        <div class="col-md-6 col-sd-12">
          <input type="tel" class="form-control bg-secondary-subtle border-0 py-3" name="phone" placeholder="Phone Number">
        </div>
        <div class="col-md-6 col-sd-12">
          <select class="form-select bg-secondary-subtle border-0 py-3" name="service">
            <option selected disabled>Service Of Interest</option>
            <option value="web-design">Web Design</option>
            <option value="frontend-dev">Frontend Development</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="col-md-6 col-sd-12">
          <input type="text" class="form-control bg-secondary-subtle border-0 py-3" name="timeline" placeholder="Timeline">
        </div>
        <div class="col-md-6 col-sd-12">
          <textarea class="form-control bg-secondary-subtle border-0" name="details" rows="6" placeholder="Project Details..." style="resize:none;"></textarea>
        </div>
      </div>

      <div class="text-end mt-4">
        <button type="submit" class="btn btn-outline-light px-4 py-2 rounded-3">Send</button>
      </div>
    </form>
  </div>
</section>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
